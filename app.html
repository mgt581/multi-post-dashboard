<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multipost | Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

    :root {
      --bg: linear-gradient(135deg, #0f172a, #0b2f52 60%, #0ea5e9);
      --card: #0b1829;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .page { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; align-items: center; justify-content: space-between; }

    .greeting p { margin: 0; font-size: 14px; color: var(--muted); font-weight: 700; }
    .greeting h1 { margin: 4px 0 0; font-size: 26px; }

    .header-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.35);
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }

    .section-title { font-weight: 800; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-left: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      color: var(--text);
      text-decoration: none;
      position: relative;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      overflow: hidden;
    }

    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .card-content { flex: 1; }
    .card-title { display: block; font-weight: 700; font-size: 17px; }
    .card-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

    .chevron { color: var(--muted); font-size: 14px; }
    /* Folder action buttons */
    .folder-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .action-btn.delete {
      color: #f87171;
      border-color: rgba(248,113,113,0.3);
    }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11, 24, 41, 0.85); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); z-index: 100; }
    .nav-item { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; }
    .nav-item.active { color: var(--accent-2); }
    .nav-item i { font-size: 20px; }

    .workspace-status {
      margin: 0;
      padding: 12px 14px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      background: rgba(14, 165, 233, 0.12);
      color: #bae6fd;
      font-size: 14px;
    }
    .workspace-status.error {
      border-color: rgba(248, 113, 113, 0.4);
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
    }

    .brand-dialog {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .brand-dialog::backdrop { background: rgba(2, 6, 23, 0.78); }
    .brand-dialog form { padding: 22px; }
    .brand-dialog h2 { margin: 0 0 18px; font-size: 20px; }
    .brand-dialog label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 800; color: var(--muted); }
    .brand-dialog input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .brand-dialog input:focus { border-color: var(--accent-2); }
    .brand-dialog p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .dialog-button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .dialog-button.primary { border-color: transparent; background: var(--accent-2); color: white; }
    .dialog-button.danger { border-color: transparent; background: #dc2626; color: white; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="greeting">
        <p>Welcome to Multipost</p>
        <h1 id="userGreeting">Your Brands</h1>
      </div>
      <button class="header-btn" onclick="location.href='settings.html'">
        <i class="fa-solid fa-cog"></i>
      </button>
    </header>

    <div>
      <button class="btn" onclick="createNewFolder()">
        <i class="fa-solid fa-plus" style="margin-right:8px;"></i> Create New Brand
      </button>
    </div>

    <p id="workspaceStatus" class="workspace-status" role="status" hidden></p>

    <div>
      <div class="section-title">Active Brands</div>
      <div id="folderContainer" style="margin-top: 10px;">
        <div class="card" style="justify-content: center; border-style: dashed; opacity: 0.7;">
          <p class="card-sub">Loading your brands...</p>
        </div>
      </div>
    </div>

  </div>

  <dialog id="brandDialog" class="brand-dialog">
    <form id="brandDialogForm">
      <h2 id="brandDialogTitle">Create brand</h2>
      <p id="brandDialogMessage" hidden></p>
      <div id="brandDialogInputGroup">
        <label for="brandDialogInput">Brand or client name</label>
        <input id="brandDialogInput" type="text" maxlength="80" autocomplete="organization" />
      </div>
      <div class="dialog-actions">
        <button id="brandDialogCancel" class="dialog-button" type="button">Cancel</button>
        <button id="brandDialogConfirm" class="dialog-button primary" type="submit">Create brand</button>
      </div>
    </form>
  </dialog>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>HOME</span></a>
    <a href="create-post.html" class="nav-item"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI SEO</span></a>
    <a href="settings.html" class="nav-item"><i class="fa-solid fa-user"></i><span>PROFILE</span></a>
  </nav>

  <script>
    // Dynamically set API base to avoid CORS issues on custom domains
    const host = window.location.hostname;
    const isProdHost = host === "multipostapp.co.uk" || host === "www.multipostapp.co.uk";
    const isPreviewHost = host.endsWith(".pages.dev");
    const apiBase = isProdHost
      ? "/api"
      : isPreviewHost
        ? "https://multipost-seo-worker-preview.alexbryant.workers.dev/api"
        : "https://multipost-seo-worker.alexbryant.workers.dev/api";

    let userScope = null;
    let authUser = null;
    let brandDialogResolve = null;
    let brandDialogUsesInput = true;
    const scopedKey = name => `${name}:${userScope}`;

    const brandDialog = document.getElementById("brandDialog");
    const brandDialogForm = document.getElementById("brandDialogForm");
    const brandDialogTitle = document.getElementById("brandDialogTitle");
    const brandDialogMessage = document.getElementById("brandDialogMessage");
    const brandDialogInputGroup = document.getElementById("brandDialogInputGroup");
    const brandDialogInput = document.getElementById("brandDialogInput");
    const brandDialogConfirm = document.getElementById("brandDialogConfirm");

    function showWorkspaceStatus(message, isError = false) {
      const status = document.getElementById("workspaceStatus");
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.hidden = !message;
    }

    function finishBrandDialog(value) {
      const resolve = brandDialogResolve;
      brandDialogResolve = null;
      if (brandDialog.open) brandDialog.close();
      if (resolve) resolve(value);
    }

    function openBrandDialog({ title, value = "", message = "", confirmLabel, usesInput = true, danger = false }) {
      if (brandDialogResolve) finishBrandDialog(null);
      brandDialogTitle.textContent = title;
      brandDialogMessage.textContent = message;
      brandDialogMessage.hidden = !message;
      brandDialogInputGroup.hidden = !usesInput;
      brandDialogInput.value = value;
      brandDialogUsesInput = usesInput;
      brandDialogConfirm.textContent = confirmLabel;
      brandDialogConfirm.classList.toggle("danger", danger);
      brandDialogConfirm.classList.toggle("primary", !danger);
      brandDialog.showModal();
      if (usesInput) {
        requestAnimationFrame(() => {
          brandDialogInput.focus();
          brandDialogInput.select();
        });
      }
      return new Promise(resolve => { brandDialogResolve = resolve; });
    }

    brandDialogForm.addEventListener("submit", event => {
      event.preventDefault();
      if (!brandDialogUsesInput) {
        finishBrandDialog(true);
        return;
      }
      const value = brandDialogInput.value.trim();
      if (!value) {
        brandDialogInput.focus();
        return;
      }
      finishBrandDialog(value);
    });
    document.getElementById("brandDialogCancel").addEventListener("click", () => finishBrandDialog(null));
    brandDialog.addEventListener("cancel", event => {
      event.preventDefault();
      finishBrandDialog(null);
    });

    function normalizeEmail(value) {
      return String(value || "").trim().toLowerCase();
    }

    const ownerKeys = [
      "alexbryant3234@gmail.com",
      "alexbryantwork3234@outlook.com",
      "Y98MCpY2VTQujHVwvhufxYE6Azh1",
      "L6GV2I8v1IZ8ZsSJVlof9K559A43",
      "XvLFswTmQ7YalJNYTC3vT7Y9OsB3"
    ];

    function isOwnerUser(user) {
      const identityKeys = [
        normalizeEmail(user?.email),
        String(user?.uid || "").trim()
      ].filter(Boolean);
      return identityKeys.some(key => ownerKeys.some(ownerKey => normalizeEmail(ownerKey) === normalizeEmail(key)));
    }

    function isSocialProviderUser(user) {
      return /^(facebook|tiktok):/.test(normalizeEmail(user?.uid));
    }

    function getStoredOwnerKeys(keys) {
      return keys
        .map(value => String(value || "").trim())
        .filter(value => ownerKeys.some(ownerKey => normalizeEmail(ownerKey) === normalizeEmail(value)));
    }

    function getUserScopeCandidates(user) {
      let knownKeys = [];
      try {
        knownKeys = JSON.parse(localStorage.getItem("knownUserKeys") || "[]");
      } catch (_) {
        knownKeys = [];
      }
      const canUseOwnerKeys = isOwnerUser(user);
      const canUseStoredOwnerKeys = canUseOwnerKeys || isSocialProviderUser(user);
      const storedOwnerKeys = canUseStoredOwnerKeys
        ? getStoredOwnerKeys([localStorage.getItem("currentUserKey"), ...knownKeys])
        : [];
      const trustedKnownKeys = canUseOwnerKeys ? knownKeys : storedOwnerKeys;
      const trustedStoredKey = canUseOwnerKeys
        ? (storedOwnerKeys[0] || localStorage.getItem("currentUserKey"))
        : (storedOwnerKeys[0] || "");

      const candidates = [
        normalizeEmail(user?.email),
        normalizeEmail(trustedStoredKey),
        ...trustedKnownKeys.map(normalizeEmail),
        ...(canUseOwnerKeys ? ownerKeys.map(normalizeEmail) : []),
        String(user?.email || "").trim(),
        String(trustedStoredKey || "").trim(),
        ...trustedKnownKeys.map(value => String(value || "").trim()),
        ...(canUseOwnerKeys ? ownerKeys : []),
        String(user?.uid || "").trim()
      ].filter(Boolean);
      return [...new Set(candidates)];
    }

    function rememberUserScope(scope) {
      const key = normalizeEmail(scope);
      if (!key) return;
      let knownKeys = [];
      try {
        knownKeys = JSON.parse(localStorage.getItem("knownUserKeys") || "[]");
      } catch (_) {
        knownKeys = [];
      }
      localStorage.setItem("currentUserKey", key);
      localStorage.setItem("knownUserKeys", JSON.stringify([...new Set([key, ...knownKeys.map(normalizeEmail)].filter(Boolean))].slice(0, 8)));
    }

    async function fetchFoldersForScope(scope) {
      const emailParam = authUser?.email ? `&user_email=${encodeURIComponent(authUser.email)}` : "";
      const res = await fetch(`${apiBase}/get-folders?user_id=${encodeURIComponent(scope)}${emailParam}`);
      if (!res.ok) throw new Error("Server error");
      return res.json();
    }

    function adoptFolderScope(folders) {
      const folderUserId = String(folders?.[0]?.user_id || "").trim();
      if (!folderUserId || folderUserId === userScope) return;
      userScope = folderUserId;
      rememberUserScope(userScope);
    }

    async function loadFolders() {
      if (!userScope && authUser) {
        userScope = getUserScopeCandidates(authUser)[0] || null;
      }
      if (!userScope) return;
      const container = document.getElementById("folderContainer");
      try {
        let folders = await fetchFoldersForScope(userScope);
        if (folders.length > 0) adoptFolderScope(folders);

        if (folders.length === 0 && authUser) {
          for (const candidate of getUserScopeCandidates(authUser)) {
            if (candidate === userScope) continue;
            const candidateFolders = await fetchFoldersForScope(candidate);
            if (candidateFolders.length > 0) {
              userScope = candidate;
              rememberUserScope(userScope);
              folders = candidateFolders;
              adoptFolderScope(folders);
              break;
            }
          }
        }

        if (folders.length === 0) {
          container.innerHTML = `<div class="card" style="border-style:dashed; justify-content:center; opacity:0.7;"><p class="card-sub">No brands yet. Start by creating one!</p></div>`;
          return;
        }

        container.innerHTML = folders.map(f => {
          const iconBox = f.youtube_picture
            ? `<div class="icon-box" style="background:rgba(239,68,68,0.12);"><img src="${f.youtube_picture}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><i class="fa-brands fa-youtube" style="display:none;color:#ef4444;font-size:22px;"></i></div>`
            : `<div class="icon-box"><i class="fa-solid fa-folder"></i></div>`;
          const subText = f.youtube_channel
            ? `<i class="fa-brands fa-youtube" style="color:#ef4444;margin-right:4px;"></i>${f.youtube_channel}`
            : 'Manage assets &amp; accounts';
          return `
          <div class="card folder-card" data-folder-id="${f.id}" data-folder-name="${f.name}">
            ${iconBox}
            <div class="card-content">
              <span class="card-title">${f.name}</span>
              <span class="card-sub">${subText}</span>
            </div>
            <div class="folder-actions">
              <button class="action-btn rename-btn" data-id="${f.id}" data-name="${f.name}">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="action-btn delete delete-btn" data-id="${f.id}">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>`;
        }).join('');

        // Click listeners... (kept existing logic)
        container.querySelectorAll('.folder-card').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.rename-btn') || e.target.closest('.delete-btn')) return;
            openFolder(card.dataset.folderId, card.dataset.folderName);
          });
        });

        container.querySelectorAll('.rename-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const newName = await openBrandDialog({
              title: "Rename brand",
              value: btn.dataset.name,
              confirmLabel: "Save name"
            });
            if (!newName) return;
            await fetch(`${apiBase}/rename-folder`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id, name: newName, user_id: userScope })
            });
            loadFolders();
          });
        });

        container.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const confirmed = await openBrandDialog({
              title: "Delete brand",
              message: "Delete this brand and its linked account records?",
              confirmLabel: "Delete brand",
              usesInput: false,
              danger: true
            });
            if (!confirmed) return;
            await fetch(`${apiBase}/delete-folder`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: btn.dataset.id, user_id: userScope })
            });
            loadFolders();
          });
        });

      } catch (err) {
        container.innerHTML = `<p style="color:#f87171; text-align:center;">Failed to load brands.</p>`;
      }
    }

    async function createNewFolder() {
      if (!userScope) {
        showWorkspaceStatus("You must be signed in to create a brand.", true);
        return;
      }
      const name = await openBrandDialog({
        title: "Create brand",
        confirmLabel: "Create brand"
      });
      if (!name) return;

      try {
        showWorkspaceStatus("");
        const res = await fetch(`${apiBase}/add-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, user_id: userScope })
        });

        const data = await res.json();
        if (!res.ok || data.success === false) {
           throw new Error(data.error || "Server rejected request");
        }

        await loadFolders();
        showWorkspaceStatus("Brand created.");
      } catch (err) {
        console.error("Create Error:", err);
        showWorkspaceStatus("Error creating brand: " + err.message, true);
      }
    }

    function openFolder(id, name) {
      localStorage.setItem(scopedKey("activeFolderId"), id);
      localStorage.setItem(scopedKey("activeFolderName"), name);
      window.location.href = `folder.html?id=${id}`;
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      authUser = user;
      userScope = getUserScopeCandidates(user)[0] || null;
      rememberUserScope(userScope);
      document.getElementById("userGreeting").innerText = user.displayName ? user.displayName.split(' ')[0] : "Your Brands";
      loadFolders();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
