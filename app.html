<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multipost | Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div>
        <p style="margin:0; font-size:12px; color:var(--muted); font-weight:600;">Welcome back,</p>
        <h1 id="userGreeting">Your Workspaces</h1>
      </div>
      <button class="header-btn" onclick="location.href='settings.html'">
        <i class="fa-solid fa-cog"></i>
      </button>
    </header>

    <div class="section" style="margin-top: 20px;">
      <button class="btn-primary" onclick="createNewFolder()" style="background: var(--accent); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);">
        <i class="fa-solid fa-plus" style="margin-right:8px;"></i> Create New Brand
      </button>
    </div>

    <div class="section">
      <div class="section-title">Active Clients</div>
      <div id="folderContainer">
        <div class="card" style="justify-content: center; border: 1px dashed var(--muted); opacity: 0.6;">
          <p class="card-sub">Loading your brands...</p>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="app.html" class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>HOME</span>
      </a>
      <a href="create-post.html" class="nav-item">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI SEO</span>
      </a>
      <a href="settings.html" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>PROFILE</span>
      </a>
    </nav>
  </div>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    const scopedKey = name => `${name}:${userScope}`;

    async function loadFolders() {
      if (!userScope) return;
      const container = document.getElementById("folderContainer");
      try {
        const res = await fetch(`${apiBase}/get-folders?user_id=${encodeURIComponent(userScope)}`);
        const folders = await res.json();
        
        if (folders.length === 0) {
          container.innerHTML = `<div class="card"><div class="card-content"><p class="card-sub">No brands yet. Start by creating one!</p></div></div>`;
          return;
        }

        container.innerHTML = folders.map(f => `
          <div class="card" onclick="openFolder(${f.id}, '${f.name.replace(/'/g, "\\'")}')">
            <div class="card-icon" style="background:#ecfdf5; color:var(--accent);">
              <i class="fa-solid fa-folder"></i>
            </div>
            <div class="card-content">
              <span class="card-title">${f.name}</span>
              <span class="card-sub">Manage assets and accounts</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:var(--muted); font-size:12px;"></i>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:red; text-align:center;">Failed to load data.</p>`;
      }
    }

    async function createNewFolder() {
      const name = prompt("Enter Brand or Client Name:");
      if (!name) return;
      try {
        await fetch(`${apiBase}/add-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, user_id: userScope })
        });
        loadFolders();
      } catch (err) { alert("Error creating brand"); }
    }

    function openFolder(id, name) {
      localStorage.setItem(scopedKey("activeFolderId"), id);
      localStorage.setItem(scopedKey("activeFolderName"), name);
      window.location.href = `folder.html?id=${id}`;
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      userScope = user.uid || user.email;
      document.getElementById("userGreeting").innerText = user.displayName ? `Hi, ${user.displayName.split(' ')[0]}` : "Your Workspaces";
      loadFolders();
    });
  </script>
</body>
</html>
