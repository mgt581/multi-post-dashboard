name = "multipost-seo-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

workers_dev = true
preview_urls = true

# Routes: the Worker handles only /api/* on the production domain.
# All other paths (e.g. /, /app.html) are served by Cloudflare Pages / static hosting.
# Both www and apex variants are listed so OAuth callbacks work on either host.
routes = [
  { pattern = "multipostapp.co.uk/api/*", zone_name = "multipostapp.co.uk" },
  { pattern = "www.multipostapp.co.uk/api/*", zone_name = "multipostapp.co.uk" }
]

[vars]
BASE_URL = "https://multipostapp.co.uk"
FRONTEND_URL = "https://multipostapp.co.uk"
# GOOGLE_CLIENT_ID, TIKTOK_CLIENT_KEY, FB_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# TIKTOK_CLIENT_SECRET, and FB_CLIENT_SECRET must be set via:
#   wrangler secret put <NAME>
# Do NOT add them here; this file is committed to version control.
[[d1_databases]]
binding = "DB"
database_name = "accountsmultipostapp"
database_id = "19dfae46-a6cb-4e88-ab7c-2ab2fea3279a"
migrations_dir = "migrations"

[ai]
binding = "AI"

[observability.logs]
enabled = true
