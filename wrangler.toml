name = "multipost-seo-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "accountsmultipostapp"
database_id = "19dfae46-a6cb-4e88-ab7c-2ab2fea3279a"

# AI Binding for Llama Model
[ai]
binding = "AI"

# Environment Variables (Secrets)
# Set these using: wrangler secret put <SECRET_NAME>
# Required: BASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, FB_CLIENT_ID, FB_CLIENT_SECRET
# Note: BASE_URL must match the primary domain you use to access the worker (e.g., https://multipostapp.co.uk)
