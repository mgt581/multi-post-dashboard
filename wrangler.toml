name = "multipost-seo-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# 1. Routing - This connects your domain to the worker
routes = [
    { pattern = "multipostapp.co.uk", custom_domain = true },
    { pattern = "www.multipostapp.co.uk", custom_domain = true }
]

# 2. D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "accountsmultipostapp"
database_id = "19dfae46-a6cb-4e88-ab7c-2ab2fea3279a"

# 3. AI Binding for Llama Model
[ai]
binding = "AI"

# 4. Environment Notes
# Remember to update your secrets for the new domain!
# Run these in your terminal:
# npx wrangler secret put BASE_URL -> https://multipostapp.co.uk
# npx wrangler secret put FRONTEND_URL -> https://multipostapp.co.uk