name = "multipost-seo-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "accountsmultipostapp"
database_id = "19dfae46-a6cb-4e88-ab7c-2ab2fea3279a"

# Environment Variables (Secrets)
# Set these using: wrangler secret put <SECRET_NAME>
# Required: OPENAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, FB_CLIENT_ID, FB_CLIENT_SECRET
