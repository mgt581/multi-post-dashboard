name = "multipost-seo-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "accountsmultipostapp"
database_id = "19dfae46-a6cb-4e88-ab7c-2ab2fea3279a"

[ai]
binding = "AI"

# OAuth Client IDs (Public - safe to include)
[vars]
GOOGLE_CLIENT_ID = "1099160429576-38kfvgqfgahc80oc11v1abl79n1gdspm.apps.googleusercontent.com"
TIKTOK_CLIENT_KEY = "your_tiktok_client_key"
FB_CLIENT_ID = "your_facebook_app_id"

# OAuth Client Secrets (Sensitive - must be set via CLI)
