name: MultiPost isolated prelaunch preview
on:
  push:
    branches: ["audit/prelaunch-preview-20261024"]
permissions:
  contents: read
concurrency:
  group: multipost-prelaunch-preview-20261024
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-prelaunch-preview.mjs
      - run: node scripts/configure-prelaunch-preview.mjs
      - name: Initialize only the dedicated synthetic preview database
        run: npx wrangler d1 execute multipost-prelaunch-isolated-20261024 --remote --file=schema.sql --config wrangler.prelaunch.json
      - name: Deploy only the isolated review Worker
        run: npx wrangler deploy --config wrangler.prelaunch.json
      - name: Check preview health and blocked side effects
        run: |
          curl --fail --retry 3 --location https://multipost-prelaunch-preview-20261024.alexbryant.workers.dev/api/health
          test "$(curl -sL -o /dev/null -w '%{http_code}' -X POST https://multipost-prelaunch-preview-20261024.alexbryant.workers.dev/api/facebook/upload)" = "403"
