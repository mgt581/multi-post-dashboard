name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate required deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${TIKTOK_CLIENT_SECRET:-}" ] || missing="$missing TIKTOK_CLIENT_SECRET"
          [ -n "${FIREBASE_CLIENT_EMAIL:-}" ] || missing="$missing FIREBASE_CLIENT_EMAIL"
          [ -n "${FIREBASE_PRIVATE_KEY:-}" ] || missing="$missing FIREBASE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing required GitHub Actions secrets:$missing"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload GOOGLE_CLIENT_SECRET
        run: |
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler versions secret put GOOGLE_CLIENT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload TIKTOK_CLIENT_SECRET
        run: |
          if [ -n "${TIKTOK_CLIENT_SECRET:-}" ]; then
            printf '%s' "$TIKTOK_CLIENT_SECRET" | npx wrangler versions secret put TIKTOK_CLIENT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}

      - name: Upload FIREBASE_CLIENT_EMAIL
        run: |
          if [ -n "${FIREBASE_CLIENT_EMAIL:-}" ]; then
            printf '%s' "$FIREBASE_CLIENT_EMAIL" | npx wrangler versions secret put FIREBASE_CLIENT_EMAIL
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}

      - name: Upload FIREBASE_PRIVATE_KEY
        run: |
          if [ -n "${FIREBASE_PRIVATE_KEY:-}" ]; then
            printf '%s' "$FIREBASE_PRIVATE_KEY" | npx wrangler versions secret put FIREBASE_PRIVATE_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

      - name: Upload FB_CLIENT_SECRET
        run: |
          if [ -n "${FB_CLIENT_SECRET:-}" ]; then
            printf '%s' "$FB_CLIENT_SECRET" | npx wrangler versions secret put FB_CLIENT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FB_CLIENT_SECRET: ${{ secrets.FB_CLIENT_SECRET }}

      - name: Upload STRIPE_SECRET_KEY
        run: |
          if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler versions secret put STRIPE_SECRET_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Upload STRIPE_WEBHOOK_SECRET
        run: |
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx wrangler versions secret put STRIPE_WEBHOOK_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Upload OWNER_ADMIN_TOKEN
        run: |
          if [ -n "${OWNER_ADMIN_TOKEN:-}" ]; then
            printf '%s' "$OWNER_ADMIN_TOKEN" | npx wrangler versions secret put OWNER_ADMIN_TOKEN
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_ADMIN_TOKEN: ${{ secrets.OWNER_ADMIN_TOKEN }}

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS -H "Accept: application/json" "https://multipost-seo-worker.alexbryant.workers.dev/api/health" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed for https://multipost-seo-worker.alexbryant.workers.dev/api/health"
          exit 1
