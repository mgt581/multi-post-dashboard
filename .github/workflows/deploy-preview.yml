name: Deploy Preview Worker

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-preview-worker
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Preview Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview environment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

      - name: Verify preview health
        run: |
          set -euo pipefail
          preview_url="https://multipost-seo-worker-preview.alexbryant.workers.dev/api/health"
          for attempt in 1 2 3 4 5; do
            response="$(curl -fsS -H "Accept: application/json" "$preview_url" || true)"
            if printf '%s' "$response" | grep -q 'facebook-stable-video-permalink'; then
              printf '%s\n' "$response"
              exit 0
            fi
            sleep 5
          done
          echo "Preview health check did not return the expected worker version"
          exit 1
