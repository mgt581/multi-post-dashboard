name: Deploy Preview Worker

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-preview-worker
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Preview Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview environment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.toml

      - name: Configure isolated preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PREVIEW_ACCESS_TOKEN: ${{ secrets.SEO_PREVIEW_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ] || [ -z "${PREVIEW_ACCESS_TOKEN:-}" ]; then
            echo "OPENAI_API_KEY and SEO_PREVIEW_ACCESS_TOKEN are required"
            exit 1
          fi
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --config wrangler.preview.toml
          printf '%s' "$PREVIEW_ACCESS_TOKEN" | npx wrangler secret put PREVIEW_ACCESS_TOKEN --config wrangler.preview.toml

      - name: Verify preview health
        run: |
          set -euo pipefail
          preview_url="https://multipost-seo-fallback-preview.alexbryant.workers.dev"
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$preview_url" || true)"
            if [ "$status" = "401" ]; then
              echo "Private isolated preview is responding"
              exit 0
            fi
            sleep 5
          done
          echo "Private isolated preview did not respond as expected"
          exit 1
