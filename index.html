<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multipost | Workspaces</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

    :root {
      --bg: linear-gradient(135deg, #0f172a, #0b2f52 60%, #0ea5e9);
      --card: #0b1829;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
      --error: #f43f5e;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .page { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; align-items: center; justify-content: space-between; }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 48px; height: 48px; border-radius: 12px; }
    .brand h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.2);
      transition: transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-small { width: auto; padding: 8px 16px; font-size: 13px; border-radius: 10px; }

    .stats { display: flex; gap: 10px; margin-bottom: 5px; }
    .pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .bulk-bar {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title { font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-left: 4px; }

    .folder-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .card-title { display: block; font-weight: 700; font-size: 17px; }
    .card-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 700; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-weight: 700;
    }

    footer {
        margin-top: 40px;
        padding: 30px 20px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 24px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--border);
    }
    footer a { color: var(--accent-2); text-decoration: none; font-weight: 700; }

    .dot-btn { background: transparent; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <img src="logo.png" alt="Logo">
        <h1>Workspaces</h1>
      </div>
      <button class="btn btn-small" onclick="window.location.href='settings.html'">
        <i class="fa-solid fa-cog"></i>
      </button>
    </header>

    <div class="stats">
      <div class="pill" id="folderCountPill">0 Workspaces</div>
      <div class="pill">Cloud Sync Active</div>
    </div>

    <button class="btn" onclick="createNewFolder()">
      <i class="fa-solid fa-plus"></i> New Workspace
    </button>

    <div class="section-title">Your Brands</div>
    <div id="folderContainer">
      <div class="empty-state">Loading your workspaces...</div>
    </div>

    <footer>
        <p><b>Multi Post</b> by Bryant Group Holdings Ltd.</p>
        <p>Company Number: 13671131</p>
        <div style="margin: 15px 0;">
            <a href="terms.html">Terms</a> &bull; <a href="privacy.html">Privacy</a>
        </div>
        <p>&copy; 2026 All rights reserved.</p>
    </footer>
  </div>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = localStorage.getItem("currentUserKey");
    const scopedKey = name => `${name}:${userScope}`;

    async function loadFolders() {
      if (!userScope) return;
      const container = document.getElementById("folderContainer");
      try {
        const res = await fetch(`${apiBase}/get-folders?user_id=${encodeURIComponent(userScope)}`);
        const folders = await res.json();
        document.getElementById("folderCountPill").innerText = `${folders.length} Workspaces`;

        if (folders.length === 0) {
          container.innerHTML = `<div class="empty-state">No workspaces yet. Create one above!</div>`;
          return;
        }

        container.innerHTML = folders.map(f => `
          <div class="folder-card" onclick="openFolder(${f.id}, '${f.name.replace(/'/g, "\\'")}')" style="cursor:pointer;">
            <div class="icon-box"><i class="fa-solid fa-folder"></i></div>
            <div class="card-content">
              <span class="card-title">${f.name}</span>
              <span class="card-sub">Managed Brand</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:var(--border)"></i>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Error loading workspaces.</div>`;
      }
    }

    async function createNewFolder() {
      const name = prompt("Workspace Name:");
      if (!name) return;
      try {
        await fetch(`${apiBase}/add-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, user_id: userScope })
        });
        loadFolders();
      } catch (err) { alert("Error creating workspace"); }
    }

    function openFolder(id, name) {
      localStorage.setItem(scopedKey("activeFolderId"), id);
      localStorage.setItem(scopedKey("activeFolderName"), name);
      window.location.href = `folder.html?id=${id}`;
    }

    window.onload = () => {
        if (!userScope) window.location.href = 'signin.html';
        else loadFolders();
    }
  </script>
</body>
</html>
