<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace | Multipost</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

    :root {
      --bg: linear-gradient(135deg, #0f172a, #0b2f52 60%, #0ea5e9);
      --card: #0b1829;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
      --error: #f43f5e;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .page { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; align-items: center; justify-content: space-between; }

    .header-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }

    .brand-hero {
      background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.15), transparent), var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
    }

    .brand-info h2 { margin: 0; font-size: 20px; }
    .brand-info p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 700; }

    .section-title { font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-left: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .platform-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .card-content { flex: 1; }
    .card-title { display: block; font-weight: 700; font-size: 16px; }
    .card-sub { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }

    .btn-delete { color: var(--error); background: transparent; border: none; cursor: pointer; padding: 8px; font-size: 16px; }

    .link-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      appearance: none;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.35);
      transition: transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn:active { transform: scale(0.98); }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11, 24, 41, 0.85); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); z-index: 100; }
    .nav-item { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; }
    .nav-item.active { color: var(--accent-2); }
    .nav-item i { font-size: 20px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="app.html" class="header-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h1 id="title">Workspace</h1>
      <div style="width:44px;"></div>
    </header>

    <div class="brand-hero">
      <div class="brand-icon"><i class="fa-solid fa-briefcase"></i></div>
      <div class="brand-info">
        <h2 id="name">---</h2>
        <p id="count">Initializing...</p>
      </div>
    </div>

    <div>
      <div class="section-title">Connected Platforms</div>
      <div id="accountList" style="margin-top: 10px;">
        <div class="card" style="justify-content: center; border-style: dashed; opacity: 0.7;">
          <p class="card-sub">Fetching platforms...</p>
        </div>
      </div>
    </div>

    <div class="link-section">
      <div class="section-title" style="margin-bottom: 12px;">Link New Account</div>
      <select id="platformSelect">
        <option value="tiktok">TikTok</option>
        <option value="youtube">YouTube</option>
        <option value="facebook">Facebook</option>
      </select>
      <button class="btn" onclick="addAccount()">
        <i class="fa-solid fa-link"></i> Connect Platform
      </button>
    </div>

    <button class="btn" onclick="location.href='create-post.html'" style="margin-top: 10px;">
      <i class="fa-solid fa-wand-magic-sparkles"></i> AI SEO Studio
    </button>
  </div>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item"><i class="fa-solid fa-house"></i><span>HOME</span></a>
    <a href="create-post.html" class="nav-item"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI SEO</span></a>
    <a href="settings.html" class="nav-item"><i class="fa-solid fa-user"></i><span>PROFILE</span></a>
  </nav>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    const scopedKey = name => `${name}:${userScope}`;

    const platformMeta = {
      youtube: { name: "YouTube", icon: "fa-brands fa-youtube", color: "#ef4444", bg: "rgba(239, 68, 68, 0.1)" },
      tiktok: { name: "TikTok", icon: "fa-brands fa-tiktok", color: "#fff", bg: "rgba(255, 255, 255, 0.1)" },
      facebook: { name: "Facebook", icon: "fa-brands fa-facebook", color: "#1877f2", bg: "rgba(24, 119, 242, 0.1)" }
    };

    function initUI() {
      const folderName = localStorage.getItem(scopedKey("activeFolderName")) || "Workspace";
      document.getElementById("title").innerText = "Workspace";
      document.getElementById("name").innerText = folderName;
    }

    async function render() {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return;

      const listContainer = document.getElementById("accountList");

      try {
        const url = `${apiBase}/get-accounts?folder_id=${fId}&user_id=${encodeURIComponent(userScope)}`;
        const res = await fetch(url);
        const accs = await res.json();
        document.getElementById("count").innerText = `${accs.length} account${accs.length === 1 ? '' : 's'} linked`;

        if (accs.length === 0) {
          listContainer.innerHTML = `<div class="card" style="border-style:dashed; justify-content:center; opacity:0.7;"><p class="card-sub">No platforms connected yet.</p></div>`;
          return;
        }

        listContainer.innerHTML = accs.map(acc => {
          const meta = platformMeta[acc.platform] || { name: acc.platform, icon: "fa-solid fa-link", color: "#94a3b8", bg: "rgba(255, 255, 255, 0.05)" };
          return `
            <div class="card">
              <div class="platform-icon" style="background:${meta.bg}; color:${meta.color};">
                <i class="${meta.icon}"></i>
              </div>
              <div class="card-content">
                <span class="card-title">${acc.nickname || 'Active Account'}</span>
                <span class="card-sub" style="color:${meta.color};">${meta.name} Connected</span>
              </div>
              <button class="btn-delete" onclick="removeAccount(${acc.id})">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>`;
        }).join("");
      } catch (err) {
        listContainer.innerHTML = `<p style="color:var(--error); text-align:center;">Failed to load accounts.</p>`;
      }
    }

    function addAccount() {
      const platform = document.getElementById("platformSelect").value;
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return alert("Session expired. Please log in again.");

      const safePlatform = encodeURIComponent(platform);
      window.location.href = `${apiBase}/auth/${safePlatform}?folder_id=${encodeURIComponent(fId)}&user_id=${encodeURIComponent(userScope)}`;
    }

    async function removeAccount(accountId) {
      if (!confirm("Remove this account?")) return;
      try {
        await fetch(`${apiBase}/delete-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: accountId, user_id: userScope, type: "account_only" }),
        });
        render();
      } catch (err) { alert("Error removing account"); }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      userScope = user.uid || user.email;
      initUI();
      render();
    });
  </script>
</body>
</html>
