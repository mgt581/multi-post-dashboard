<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace View | Multipost SEO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* UI refinements for the account list */
    .status-connected { color: #10b981; font-weight: 600; }
    .status-disconnected { color: #6b7280; font-style: italic; }
    .account-card { transition: transform 0.2s ease; }
    .account-card:hover { transform: translateY(-2px); }
    .platform-icon-img { width: 32px; height: 32px; border-radius: 6px; }
    
    /* Loading Overlay */
    #secure-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f5f7fb; z-index: 9999; display: flex;
      align-items: center; justify-content: center; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="secure-overlay">Verifying Security...</div>

  <div class="app">
    <header class="header">
      <a href="app.html" class="back-link">←</a> 
      <span class="title" id="title">Loading Workspace...</span>
    </header>
    
    <div class="card" style="margin:20px; border-left: 5px solid #6366f1;">
      <div style="padding: 5px 0;">
        <small style="text-transform: uppercase; color: #6366f1; font-weight: bold;">Current Workspace</small><br>
        <strong id="name" style="font-size: 1.4rem;">---</strong><br>
        <span id="count" style="color: #6b7280;">Initializing...</span>
      </div>
    </div>

    <section class="cards" id="accountList">
      <div style="text-align:center; padding: 40px; color: #9ca3af;">
        Fetching secure platform data...
      </div>
    </section>

    <div class="card" style="display:flex; flex-direction: column; gap:12px; margin:20px; background: #f9fafb;">
      <label style="font-size: 0.9rem; font-weight: 600; color: #374151;">Connect New Platform</label>
      <div style="display:flex; gap:10px;">
        <select id="platformSelect" style="flex:1; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db;">
          <option value="tiktok">TikTok</option>
          <option value="youtube">YouTube</option>
          <option value="facebook">Facebook</option>
        </select>
        <button class="btn-gradient" onclick="addAccount()" style="min-width: 100px;">Add</button>
      </div>
    </div>

    <div style="margin-top: 30px; padding-bottom: 50px;">
      <button class="btn-gradient" style="width:90%; margin: 0 auto; display:block; padding: 15px; font-size: 1.1rem;" onclick="location.href='create-post.html'">
        ✏️ Create New Post
      </button>
    </div>
  </div>

  <script>
    /**
     * MULTIPOST SEO - SECURE FOLDER VIEW
     * NO MIGRATION LOGIC - NO DATA LEAKS
     */
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    // Helper to get scoped keys
    const scopedKey = name => `${name}:${userScope}`;

    const platformMeta = {
      youtube: { name: "YouTube", logo: "https://cdn.simpleicons.org/youtube/FF0000", iconBg: "#fff0f0" },
      tiktok: { name: "TikTok", logo: "https://cdn.simpleicons.org/tiktok/000000", iconBg: "#f3f4f6" },
      facebook: { name: "Facebook", logo: "https://cdn.simpleicons.org/facebook/1877F2", iconBg: "#f0f7ff" }
    };

    // 1. SETUP UI
    function initUI() {
      const folderName = localStorage.getItem(scopedKey("activeFolderName")) || "Workspace";
      document.getElementById("title").innerText = folderName;
      document.getElementById("name").innerText = folderName;
      document.getElementById("secure-overlay").style.display = "none";
    }

    // 2. RENDER ACCOUNTS
    async function render() {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return;

      const listContainer = document.getElementById("accountList");
      
      try {
        const url = `${apiBase}/get-accounts?folder_id=${fId}&user_id=${encodeURIComponent(userScope)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Unauthorized");
        
        const accs = await res.json();
        document.getElementById("count").innerText = `${accs.length} total accounts connected`;

        const grouped = accs.reduce((map, acc) => {
          if (!map[acc.platform]) map[acc.platform] = [];
          map[acc.platform].push(acc);
          return map;
        }, {});

        const cardsHTML = ["youtube", "tiktok", "facebook"].map(platform => {
          const meta = platformMeta[platform];
          const accounts = grouped[platform] || [];

          if (accounts.length === 0) {
            return `
              <div class="card account-card" style="opacity: 0.7;">
                <div class="icon" style="background:${meta.iconBg}; padding:8px; border-radius:10px;">
                  <img class="platform-icon-img" src="${meta.logo}" alt="${meta.name}">
                </div>
                <div class="card-text">
                  <strong>${meta.name}</strong>
                  <div class="status-disconnected">Not Linked</div>
                </div>
                <button class="btn-ghost" onclick="initiateOAuth('${platform}')">Link</button>
              </div>`;
          }

          return accounts.map(acc => `
            <div class="card account-card">
              <div class="icon" style="background:${meta.iconBg}; padding:8px; border-radius:10px; border: 1px solid #e5e7eb;">
                <img class="platform-icon-img" src="${meta.logo}" alt="${meta.name}">
              </div>
              <div class="card-text">
                <strong>${acc.nickname || 'Active Account'}</strong>
                <div class="status-connected">Connected</div>
              </div>
              <button class="btn-ghost" style="color: #ef4444;" onclick="removeAccount(${acc.id}, this)">Remove</button>
            </div>`).join("");
        });

        listContainer.innerHTML = cardsHTML.join("");
      } catch (err) {
        listContainer.innerHTML = `<div class="card" style="color:red; text-align:center;">Session Error. Please return to dashboard.</div>`;
      }
    }

    // 3. OAUTH LOGIC
    function addAccount() {
      const platform = document.getElementById("platformSelect").value;
      initiateOAuth(platform);
    }

    function initiateOAuth(platform) {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return alert("Security Error: No session found.");

      const state = btoa(`${fId}|${userScope}`); 
      window.location.href = `${apiBase}/auth/${platform}?state=${state}`;
    }

    // 4. REMOVE ACCOUNT
    async function removeAccount(accountId, btnEl) {
      if (!confirm("Remove this account?")) return;
      btnEl.disabled = true;
      try {
        const res = await fetch(`${apiBase}/delete-folder`, { 
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: accountId, user_id: userScope, type: "account_only" }),
        });
        if (res.ok) render();
      } catch (err) { alert("Error removing account"); btnEl.disabled = false; }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      
      // Set the verified user scope
      userScope = user.uid || user.email;
      
      // Now that we have the scope, we can safely initialize the UI and Data
      initUI();
      render();
    });
  </script>
</body>
</html>
