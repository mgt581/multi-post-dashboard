<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace View | Multipost SEO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <button class="header-btn" onclick="location.href='app.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 id="title">Loading...</h1>
      <div style="width:40px;"></div>
    </header>
    
    <div class="section" style="margin-top:20px;">
      <div class="card" style="background: var(--primary); color: white; border: none;">
        <div class="card-icon" style="background: rgba(255,255,255,0.2); color: white;">
          <i class="fa-solid fa-briefcase"></i>
        </div>
        <div class="card-content">
          <span class="card-title" id="name" style="color:white;">---</span>
          <span class="card-sub" id="count" style="color:rgba(255,255,255,0.8);">Initializing...</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Connected Platforms</div>
      <div id="accountList">
        <div class="card" style="justify-content: center; border: 1px dashed var(--muted); opacity: 0.6;">
          <p class="card-sub">Fetching platform data...</p>
        </div>
      </div>
    </div>

    <div class="section" style="margin-top: 20px;">
      <button id="seoBtn" class="btn-primary" onclick="goToCreatePost()" style="background: var(--accent); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);">
        <i class="fa-solid fa-wand-magic-sparkles" style="margin-right:8px;"></i> Create AI SEO Post
      </button>
    </div>

    <nav class="bottom-nav">
      <a href="app.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>HOME</span>
      </a>
      <a href="create-post.html" class="nav-item">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI SEO</span>
      </a>
      <a href="settings.html" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>PROFILE</span>
      </a>
    </nav>
  </div>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    const scopedKey = name => `${name}:${userScope}`;

    const platformMeta = {
      youtube: { name: "YouTube", icon: "fa-brands fa-youtube", color: "#ef4444", bg: "#fef2f2" },
      tiktok: { name: "TikTok", icon: "fa-brands fa-tiktok", color: "#000", bg: "#f1f5f9" },
      facebook: { name: "Facebook", icon: "fa-brands fa-facebook", color: "#1d4ed8", bg: "#eff6ff" }
    };

    function initUI() {
      const folderName = localStorage.getItem(scopedKey("activeFolderName")) || "Workspace";
      document.getElementById("title").innerText = folderName;
      document.getElementById("name").innerText = folderName;
    }

    async function render() {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return;

      const listContainer = document.getElementById("accountList");
      
      try {
        const url = `${apiBase}/get-accounts?folder_id=${fId}&user_id=${encodeURIComponent(userScope)}`;
        const res = await fetch(url);
        const accs = await res.json();
        
        // Create a map of connected accounts by platform
        const connectedPlatforms = {};
        accs.forEach(acc => {
          connectedPlatforms[acc.platform] = acc;
        });
        
        // Count connected platforms for status display
        const connectedCount = Object.keys(connectedPlatforms).length;
        document.getElementById("count").innerText = `${connectedCount} of 3 platforms connected`;
        
        // Always show all 3 platforms (YouTube, TikTok, Facebook)
        const requiredPlatforms = ['youtube', 'tiktok', 'facebook'];
        
        listContainer.innerHTML = requiredPlatforms.map(platform => {
          const meta = platformMeta[platform];
          const acc = connectedPlatforms[platform];
          
          if (acc) {
            // Platform is connected - show in green with username
            const isActive = true; // Could check token expiry here if needed
            const statusColor = isActive ? '#10b981' : '#ef4444'; // green : red
            const statusText = isActive ? 'Connected' : 'Disconnected';
            
            return `
              <div class="card">
                <div class="card-icon" style="background:${meta.bg}; color:${meta.color};">
                  <i class="${meta.icon}"></i>
                </div>
                <div class="card-content">
                  <span class="card-title" style="color:${statusColor}; font-weight:700;">${acc.nickname || meta.name}</span>
                  <span class="card-sub" style="color:${statusColor}; font-weight:600;">${statusText}</span>
                </div>
                <button class="header-btn" style="color:#ef4444; border:none; box-shadow:none; background:transparent;" onclick="removeAccount(${acc.id}, this)">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>`;
          } else {
            // Platform not connected - show "Link Now" button
            return `
              <div class="card">
                <div class="card-icon" style="background:${meta.bg}; color:${meta.color};">
                  <i class="${meta.icon}"></i>
                </div>
                <div class="card-content">
                  <span class="card-title">${meta.name}</span>
                  <span class="card-sub" style="color:#94a3b8;">Not connected</span>
                </div>
                <button class="btn-primary" style="padding:8px 16px; font-size:14px;" onclick="linkPlatform('${platform}')">
                  Link Now
                </button>
              </div>`;
          }
        }).join("");
        
        // Update SEO button state based on whether all platforms are connected
        updateSEOButtonState(connectedCount === 3);
        
      } catch (err) {
        listContainer.innerHTML = `<p style="color:red; text-align:center;">Session Error.</p>`;
      }
    }

    function addAccount() {
      const platform = document.getElementById("platformSelect").value;
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return alert("Security Error: No session found.");

      // Validate platform against known platforms to prevent misuse of DOM-derived value
      const allowedPlatforms = Object.keys(platformMeta || {});
      if (!allowedPlatforms.includes(platform)) {
        alert("Invalid platform selection.");
        return;
      }

      const safePlatform = encodeURIComponent(platform);
      window.location.href = `${apiBase}/auth/${safePlatform}?folder_id=${encodeURIComponent(fId)}&user_id=${encodeURIComponent(userScope)}`;
    }
    
    function linkPlatform(platform) {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return alert("Security Error: No session found.");
      
      const safePlatform = encodeURIComponent(platform);
      window.location.href = `${apiBase}/auth/${safePlatform}?folder_id=${encodeURIComponent(fId)}&user_id=${encodeURIComponent(userScope)}`;
    }
    
    function goToCreatePost() {
      const seoBtn = document.getElementById("seoBtn");
      if (seoBtn && seoBtn.disabled) {
        alert("Please connect all 3 platforms (YouTube, TikTok, and Facebook) before creating posts.");
        return;
      }
      location.href = 'create-post.html';
    }
    
    function updateSEOButtonState(allConnected) {
      const seoBtn = document.getElementById("seoBtn");
      if (!seoBtn) return;
      
      if (allConnected) {
        seoBtn.disabled = false;
        seoBtn.style.background = "var(--accent)";
        seoBtn.style.opacity = "1";
        seoBtn.style.cursor = "pointer";
        seoBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles" style="margin-right:8px;"></i> Create AI SEO Post';
      } else {
        seoBtn.disabled = true;
        seoBtn.style.background = "#94a3b8";
        seoBtn.style.opacity = "0.6";
        seoBtn.style.cursor = "not-allowed";
        seoBtn.innerHTML = '<i class="fa-solid fa-lock" style="margin-right:8px;"></i> Connect all 3 platforms to unlock';
      }
    }

    async function removeAccount(accountId, btnEl) {
      if (!confirm("Remove this account?")) return;
      try {
        await fetch(`${apiBase}/delete-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: accountId, user_id: userScope, type: "account_only" }),
        });
        render();
      } catch (err) { alert("Error removing account"); }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      userScope = user.uid || user.email;
      
      // Check for folder ID in URL params and update localStorage
      const urlParams = new URLSearchParams(window.location.search);
      const urlFolderId = urlParams.get('id');
      if (urlFolderId) {
        // Update localStorage with the folder ID from URL (important for OAuth redirects)
        // Note: Backend validates folder ownership via user_id in API calls
        localStorage.setItem(scopedKey("activeFolderId"), urlFolderId);
      }
      
      // Check for OAuth success/error in URL params
      const error = urlParams.get('error');
      const success = urlParams.get('success');
      
      if (success === 'account_linked') {
        // Show success message when account is successfully linked
        alert('Platform account successfully linked!');
        // Clean up URL
        window.history.replaceState({}, document.title, window.location.pathname + '?id=' + urlFolderId);
      } else if (error) {
        let errorMessage = 'Failed to connect platform account.';
        if (error === 'redirect_uri_mismatch') {
          errorMessage = 'Redirect URI mismatch. Please ensure your OAuth app redirect URIs are correctly configured.';
        } else if (error === 'token_exchange_failed') {
          errorMessage = 'Failed to exchange authorization code for access token. Check your OAuth credentials.';
        } else if (error === 'access_denied') {
          errorMessage = 'You denied access to the platform.';
        }
        alert(errorMessage);
        // Clean up URL
        window.history.replaceState({}, document.title, window.location.pathname + '?id=' + urlFolderId);
      }
      
      initUI();
      render();
    });
  </script>
</body>
</html>
