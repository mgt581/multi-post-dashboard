<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace | Multipost SEO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Quick inline CSS for cards and layout */
    body { font-family: sans-serif; margin:0; background:#f9f9f9; color:#111; }
    .app-container { padding-bottom: 80px; }
    .header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .header-btn { background:none; border:none; font-size:20px; cursor:pointer; }
    .section { margin:16px; }
    .card { background:#fff; border-radius:12px; padding:16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
    .card-icon { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-right:12px; font-size:24px; }
    .card-content { flex:1; }
    .card-title { font-weight:700; font-size:16px; }
    .card-sub { font-size:13px; color:#555; }
    .btn-primary { background:#10b981; color:#fff; border:none; padding:12px 24px; border-radius:12px; cursor:pointer; font-weight:600; }
    .bottom-nav { position:fixed; bottom:0; left:0; width:100%; display:flex; justify-content:space-around; padding:8px 0; background:#fff; box-shadow:0 -2px 5px rgba(0,0,0,0.1); }
    .nav-item { text-align:center; color:#555; font-size:12px; text-decoration:none; display:flex; flex-direction:column; align-items:center; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <button class="header-btn" onclick="location.href='app.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 id="title">Loading...</h1>
      <div style="width:40px;"></div>
    </header>

    <div class="section">
      <div class="card" style="background:#10b981; color:white; border:none;">
        <div class="card-icon" style="background:rgba(255,255,255,0.2); color:white;"><i class="fa-solid fa-briefcase"></i></div>
        <div class="card-content">
          <span class="card-title" id="name">---</span>
          <span class="card-sub" id="count">Initializing...</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title" style="font-weight:700; margin-bottom:8px;">Connected Platforms</div>
      <div id="accountList">
        <div class="card" style="justify-content:center; border:1px dashed #ccc; opacity:0.6;">
          <p class="card-sub">Fetching platform data...</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title" style="font-weight:700; margin-bottom:8px;">Link New Account</div>
      <div class="card">
        <select id="platformSelect" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ccc; font-weight:600;">
          <option value="tiktok">TikTok</option>
          <option value="youtube">YouTube</option>
          <option value="facebook">Facebook</option>
        </select>
        <button class="btn-primary" onclick="addAccount()" style="margin-left:8px;">Link</button>
      </div>
    </div>

    <div class="section">
      <button class="btn-primary" onclick="location.href='create-post.html'" style="width:100%; margin-top:12px;">
        <i class="fa-solid fa-wand-magic-sparkles" style="margin-right:8px;"></i> Create AI SEO Post
      </button>
    </div>

    <nav class="bottom-nav">
      <a href="app.html" class="nav-item"><i class="fa-solid fa-house"></i><span>HOME</span></a>
      <a href="create-post.html" class="nav-item"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI SEO</span></a>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-user"></i><span>PROFILE</span></a>
    </nav>
  </div>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    const scopedKey = name => `${name}:${userScope}`;
    const platformMeta = {
      youtube: { name:"YouTube", icon:"fa-brands fa-youtube", color:"#ef4444", bg:"#fef2f2" },
      tiktok: { name:"TikTok", icon:"fa-brands fa-tiktok", color:"#000", bg:"#f1f5f9" },
      facebook: { name:"Facebook", icon:"fa-brands fa-facebook", color:"#1d4ed8", bg:"#eff6ff" }
    };

    function initUI() {
      const folderName = localStorage.getItem(scopedKey("activeFolderName")) || "Workspace";
      document.getElementById("title").innerText = folderName;
      document.getElementById("name").innerText = folderName;
    }

    async function render() {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId) return;

      const listContainer = document.getElementById("accountList");
      listContainer.innerHTML = `<div class="card" style="justify-content:center; opacity:0.6;"><p class="card-sub">Fetching platform data...</p></div>`;

      try {
        const res = await fetch(`${apiBase}/get-accounts?folder_id=${fId}`);
        const accs = await res.json();

        document.getElementById("count").innerText = `${accs.length} accounts connected`;

        if (accs.length === 0) {
          listContainer.innerHTML = `<div class="card"><div class="card-content"><p class="card-sub">No accounts linked to this folder yet.</p></div></div>`;
          return;
        }

        listContainer.innerHTML = accs.map(acc => {
          const meta = platformMeta[acc.platform] || { name:acc.platform, icon:"fa-solid fa-link", color:"#555", bg:"#f1f5f9" };
          return `
            <div class="card">
              <div class="card-icon" style="background:${meta.bg}; color:${meta.color};"><i class="${meta.icon}"></i></div>
              <div class="card-content">
                <span class="card-title">${acc.nickname || 'Active Account'}</span>
                <span class="card-sub" style="color:${meta.color}; font-weight:700;">${meta.name} Connected</span>
              </div>
              <button class="header-btn" style="color:#ef4444; border:none; background:transparent;" onclick="removeAccount(${acc.id})">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>`;
        }).join("");

      } catch (err) {
        listContainer.innerHTML = `<p style="color:red; text-align:center;">Session Error.</p>`;
      }
    }

    function addAccount() {
      const platform = document.getElementById("platformSelect").value;
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId) return alert("Security Error: No active folder.");

      const safePlatform = encodeURIComponent(platform);
      window.location.href = `${apiBase}/auth/${safePlatform}?folder_id=${encodeURIComponent(fId)}`;
    }

    async function removeAccount(accountId) {
      if (!confirm("Remove this account?")) return;
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      await fetch(`${apiBase}/delete-folder`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id: accountId, type:"account_only" })
      });
      render();
    }

    // Initialize
    initUI();
    render();
  </script>
</body>
</html>
