<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace | Multipost</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

    :root {
      --bg: linear-gradient(135deg, #0f172a, #0b2f52 60%, #0ea5e9);
      --card: #0b1829;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
      --success: #22c55e;
      --error: #f43f5e;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .page { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; align-items: center; justify-content: space-between; }

    .header-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04); color: var(--muted); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none;
    }

    h1 { margin: 0; font-size: 24px; text-align: center; }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .hero-card h2 { margin: 0; font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--accent-2); letter-spacing: 1px; }
    .hero-card p { margin: 4px 0 0; font-size: 22px; font-weight: 800; }
    .hero-card .muted { font-size: 14px; color: var(--muted); margin-top: 2px; }

    .platform-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .platform-icon {
      width: 44px; height: 44px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 20px;
    }

    .platform-info { flex: 1; }
    .platform-info strong { display: block; font-size: 17px; font-weight: 700; }
    .platform-info span { display: block; font-size: 13px; font-weight: 700; margin-top: 2px; }

    .btn {
      border: none; border-radius: 999px; padding: 8px 16px;
      font-weight: 800; font-size: 13px; cursor: pointer;
    }
    .btn-link { background: var(--accent); color: white; }
    .btn-remove { background: rgba(244, 63, 94, 0.1); color: var(--error); border: 1px solid var(--error); }

    .btn-create-post {
      width: 100%; border: none; border-radius: 16px; padding: 16px;
      font-size: 16px; font-weight: 800; color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; text-decoration: none;
    }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11, 24, 41, 0.85); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); z-index: 100; }
    .nav-item { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; }
    .nav-item.active { color: var(--accent-2); }
    .nav-item i { font-size: 20px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="app.html" class="header-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h1 id="title">Workspace</h1>
      <div style="width:44px;"></div>
    </header>

    <div class="hero-card">
      <h2>Current Workspace</h2>
      <p id="name">---</p>
      <span id="count" class="muted">Initializing...</span>
    </div>

    <div id="accountList">
      <!-- Platform cards will be rendered here by JavaScript -->
    </div>

    <a href="create-post.html" class="btn-create-post">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Create New Post
    </a>
  </div>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>HOME</span></a>
    <a href="create-post.html" class="nav-item"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI SEO</span></a>
    <a href="settings.html" class="nav-item"><i class="fa-solid fa-user"></i><span>PROFILE</span></a>
  </nav>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    const scopedKey = name => `${name}:${userScope}`;

    const allPlatforms = {
      youtube: { name: "YouTube", icon: "fa-brands fa-youtube", color: "#ef4444", bg: "rgba(239, 68, 68, 0.1)" },
      tiktok: { name: "TikTok", icon: "fa-brands fa-tiktok", color: "#fff", bg: "rgba(255, 255, 255, 0.1)" },
      facebook: { name: "Facebook", icon: "fa-brands fa-facebook", color: "#1877f2", bg: "rgba(24, 119, 242, 0.1)" }
    };

    function initUI() {
      const folderName = localStorage.getItem(scopedKey("activeFolderName")) || "Workspace";
      document.getElementById("title").innerText = folderName;
      document.getElementById("name").innerText = folderName;
    }

    async function render() {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return;

      const listContainer = document.getElementById("accountList");
      listContainer.innerHTML = `<p style="text-align:center; color: var(--muted);">Fetching platforms...</p>`;

      try {
        const res = await fetch(`${apiBase}/get-accounts?folder_id=${fId}&user_id=${encodeURIComponent(userScope)}`);
        const linkedAccounts = await res.json();

        document.getElementById("count").innerText = `${linkedAccounts.length} total accounts connected`;

        listContainer.innerHTML = Object.keys(allPlatforms).map(key => {
          const meta = allPlatforms[key];
          const linked = linkedAccounts.find(acc => acc.platform === key);

          if (linked) {
            return `
              <div class="platform-card">
                <div class="platform-icon" style="background:${meta.bg}; color:${meta.color};"><i class="${meta.icon}"></i></div>
                <div class="platform-info">
                  <strong>${linked.nickname || meta.name}</strong>
                  <span style="color: var(--success);">Connected</span>
                </div>
                <button class="btn btn-remove" onclick="removeAccount(${linked.id})">Remove</button>
              </div>`;
          } else {
            return `
              <div class="platform-card">
                <div class="platform-icon" style="background:rgba(255,255,255,0.04); color:var(--muted);"><i class="${meta.icon}"></i></div>
                <div class="platform-info">
                  <strong>${meta.name}</strong>
                  <span style="color: var(--muted);">Not Linked</span>
                </div>
                <button class="btn btn-link" onclick="addAccount('${key}')">Link</button>
              </div>`;
          }
        }).join('');
      } catch (err) {
        listContainer.innerHTML = `<p style="color:var(--error); text-align:center;">Failed to load accounts.</p>`;
      }
    }

    function addAccount(platform) {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return alert("Session expired. Please log in again.");

      window.location.href = `${apiBase}/auth/${platform}?folder_id=${fId}&user_id=${userScope}`;
    }

    async function removeAccount(accountId) {
      if (!confirm("Remove this account?")) return;
      try {
        await fetch(`${apiBase}/delete-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: accountId, user_id: userScope, type: "account_only" }),
        });
        render(); // Re-render the list to show the change
      } catch (err) { alert("Error removing account"); }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1DMsu_ktTXfqe42q9juEloTTrKJUqpbk",
      authDomain: "pwa-ai-photo-studio-pro.firebaseapp.com",
      projectId: "pwa-ai-photo-studio-pro",
      storageBucket: "pwa-ai-photo-studio-pro.firebasestorage.app",
      messagingSenderId: "495715411996"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html"; // Redirect if not signed in
        return;
      }
      userScope = user.uid || user.email;
      initUI();
      render();
    });
  </script>
</body>
</html>
