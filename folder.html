<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace | Multipost</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-online { background-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    .status-offline { background-color: #94a3b8; }

    .platform-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .account-badge {
      background: var(--bg);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .add-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .mini-add-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mini-add-btn:hover { border-color: var(--primary); background: #f5f3ff; }
    .mini-add-btn i { font-size: 20px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <button class="header-btn" onclick="location.href='app.html'">
        <i class="fa-solid fa-house"></i>
      </button>
      <h1 id="title">Workspace</h1>
      <div style="width:40px;"></div>
    </header>
    
    <div class="section" style="margin-top:20px;">
      <div class="card" style="background: var(--primary); color: white; border: none; padding: 20px;">
        <div class="card-content">
          <span class="card-sub" style="color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1px;">Current Brand</span>
          <h2 id="name" style="margin: 4px 0 0; font-size: 24px; color: white;">---</h2>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Add New Connections</div>
      <div class="add-btn-row">
        <div class="mini-add-btn" onclick="addAccount('facebook')">
          <i class="fa-brands fa-facebook" style="color: #1877f2;"></i>
          <span style="font-size: 11px; font-weight: 800;">FACEBOOK</span>
        </div>
        <div class="mini-add-btn" onclick="addAccount('tiktok')">
          <i class="fa-brands fa-tiktok" style="color: #000;"></i>
          <span style="font-size: 11px; font-weight: 800;">TIKTOK</span>
        </div>
        <div class="mini-add-btn" onclick="addAccount('youtube')">
          <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
          <span style="font-size: 11px; font-weight: 800;">YOUTUBE</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Managed Accounts</div>
      <div id="accountList">
        <div class="card" style="justify-content: center; opacity: 0.5;">
          <p class="card-sub">Checking connections...</p>
        </div>
      </div>
    </div>

    <div class="section" style="margin-top: 20px; padding-bottom: 40px;">
      <button class="btn-primary" onclick="location.href='create-post.html'" style="background: var(--accent);">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Create AI Content
      </button>
    </div>

    <nav class="bottom-nav">
      <a href="app.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>HOME</span>
      </a>
      <a href="create-post.html" class="nav-item">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI SEO</span>
      </a>
      <a href="settings.html" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>PROFILE</span>
      </a>
    </nav>
  </div>

  <script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;
    const scopedKey = name => `${name}:${userScope}`;

    const platformMeta = {
      youtube: { name: "YouTube", icon: "fa-brands fa-youtube", color: "#ef4444", bg: "#fef2f2" },
      tiktok: { name: "TikTok", icon: "fa-brands fa-tiktok", color: "#000", bg: "#f1f5f9" },
      facebook: { name: "Facebook", icon: "fa-brands fa-facebook", color: "#1d4ed8", bg: "#eff6ff" }
    };

    function initUI() {
      const folderName = localStorage.getItem(scopedKey("activeFolderName")) || "Workspace";
      document.getElementById("title").innerText = folderName;
      document.getElementById("name").innerText = folderName;
    }

    async function render() {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return;

      const listContainer = document.getElementById("accountList");
      
      try {
        const res = await fetch(`${apiBase}/get-accounts?folder_id=${fId}&user_id=${encodeURIComponent(userScope)}`);
        const accs = await res.json();

        if (accs.length === 0) {
          listContainer.innerHTML = `
            <div class="card" style="flex-direction:column; padding: 30px; text-align:center; border: 1px dashed var(--muted);">
              <i class="fa-solid fa-link-slash" style="font-size: 24px; color: var(--muted); margin-bottom: 12px;"></i>
              <span class="card-title">No accounts linked</span>
              <span class="card-sub">Use the buttons above to connect Facebook, TikTok or YouTube.</span>
            </div>`;
          return;
        }

        listContainer.innerHTML = accs.map(acc => {
          const meta = platformMeta[acc.platform] || { name: acc.platform, icon: "fa-solid fa-link", color: "#64748b", bg: "#f1f5f9" };
          return `
            <div class="card">
              <div class="card-icon" style="background:${meta.bg}; color:${meta.color};">
                <i class="${meta.icon}"></i>
              </div>
              <div class="card-content">
                <span class="card-title">${acc.nickname || 'Connected Account'}</span>
                <div style="display:flex; align-items:center; margin-top:4px;">
                  <span class="status-dot status-online"></span>
                  <span class="card-sub" style="color: #10b981; font-weight:800; font-size:11px;">LINKED</span>
                </div>
              </div>
              <button class="header-btn" style="color:#ef4444; border:none; box-shadow:none; background:transparent;" onclick="removeAccount(${acc.id})">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>`;
        }).join("");
      } catch (err) {
        listContainer.innerHTML = `<p style="color:red; text-align:center;">Connection error. Try refreshing.</p>`;
      }
    }

    function addAccount(platform) {
      const fId = localStorage.getItem(scopedKey("activeFolderId"));
      if (!fId || !userScope) return alert("Security Error: No session found.");
      // Ensure we pass the full URL for callback calculation in worker
      window.location.href = `${apiBase}/auth/${platform}?folder_id=${fId}&user_id=${userScope}`;
    }

    async function removeAccount(accountId) {
      if (!confirm("Unlink this account from this brand?")) return;
      try {
        await fetch(`${apiBase}/delete-folder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: accountId, user_id: userScope, type: "account_only" }),
        });
        render();
      } catch (err) { alert("Error removing account"); }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      userScope = user.uid || user.email;
      initUI();
      render();
    });
  </script>
</body>
</html>
