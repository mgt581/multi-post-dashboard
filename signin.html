<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multipost | Opening App</title>
  <meta name="theme-color" content="#0b1829">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="logo.png?v=20260424">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260424">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

    :root {
      --bg: linear-gradient(135deg, #0f172a, #0b2f52 60%, #0ea5e9);
      --card: #0b1829;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.45);
    }

    h1 { margin: 0; font-size: 28px; font-weight: 800; }
    p { margin: 10px 0 0; color: var(--muted); line-height: 1.5; }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 26px auto 18px;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: var(--accent-2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .legal { margin-top: 24px; font-size: 12px; }
    .legal a { color: var(--muted); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Multipost</h1>
    <p id="status">Opening your workspace…</p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <button id="retry" class="btn" type="button">Try Again</button>
    <div class="legal">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const statusEl = document.getElementById("status");
    const spinner = document.getElementById("spinner");
    const retryBtn = document.getElementById("retry");
    let redirecting = false;

    function randomHex(bytes = 18) {
      const values = new Uint8Array(bytes);
      crypto.getRandomValues(values);
      return Array.from(values, value => value.toString(16).padStart(2, "0")).join("");
    }

    function getWorkspaceCredentials() {
      let email = localStorage.getItem("multipost_workspace_email") || "";
      let password = localStorage.getItem("multipost_workspace_password") || "";

      if (!email || !password) {
        const id = (crypto.randomUUID?.() || randomHex(16)).replace(/[^a-zA-Z0-9-]/g, "");
        email = `workspace-${id}@users.multipostapp.co.uk`;
        password = `Mp!${randomHex(24)}aA1`;
        localStorage.setItem("multipost_workspace_email", email);
        localStorage.setItem("multipost_workspace_password", password);
      }

      return { email, password };
    }

    function openWorkspace(user) {
      if (!user || redirecting) return;
      redirecting = true;
      statusEl.textContent = "Workspace ready.";
      window.location.replace("app.html");
    }

    function showError(error) {
      console.error("Workspace bootstrap failed:", error);
      statusEl.textContent = "Could not open the workspace automatically. Please try again.";
      spinner.style.display = "none";
      retryBtn.style.display = "block";
    }

    async function bootstrapWorkspace() {
      retryBtn.style.display = "none";
      spinner.style.display = "block";
      statusEl.textContent = "Opening your workspace…";

      try {
        await setPersistence(auth, browserLocalPersistence);
        if (auth.currentUser) {
          openWorkspace(auth.currentUser);
          return;
        }

        const { email, password } = getWorkspaceCredentials();

        try {
          const result = await signInWithEmailAndPassword(auth, email, password);
          openWorkspace(result.user);
          return;
        } catch (signInError) {
          const code = String(signInError?.code || "");
          const canCreate = [
            "auth/user-not-found",
            "auth/invalid-credential",
            "auth/invalid-login-credentials"
          ].includes(code);

          if (!canCreate) throw signInError;
        }

        const created = await createUserWithEmailAndPassword(auth, email, password);
        openWorkspace(created.user);
      } catch (error) {
        showError(error);
      }
    }

    onAuthStateChanged(auth, user => {
      if (user) openWorkspace(user);
    });

    retryBtn.addEventListener("click", bootstrapWorkspace);
    bootstrapWorkspace();
  </script>
</body>
</html>
