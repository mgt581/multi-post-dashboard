<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multipost | Profile</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <button class="header-btn" onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1>Settings</h1>
      <div style="width:40px;"></div>
    </header>

    <div class="section" style="text-align:center; margin-top:30px;">
      <div style="width:100px; height:100px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 16px;">
        <i class="fa-solid fa-user"></i>
      </div>
      <h2 id="userName" style="margin:0;">Loading...</h2>
      <p id="userEmail" style="color:var(--muted); font-size:14px;">---</p>
    </div>

    <div class="section">
      <div class="section-title">Account Actions</div>

      <div class="card" onclick="handleSignOut()">
        <div class="card-icon" style="background:#fef2f2; color:#ef4444;">
          <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <div class="card-content">
          <span class="card-title">Sign Out</span>
          <span class="card-sub">Securely exit your session</span>
        </div>
      </div>

      <div class="card" onclick="deleteAccount()" style="border: 1px solid #fee2e2;">
        <div class="card-icon" style="background:#fee2e2; color:#dc2626;">
          <i class="fa-solid fa-user-slash"></i>
        </div>
        <div class="card-content">
          <span class="card-title" style="color:#dc2626;">Delete Your Account</span>
          <span class="card-sub">Permanently erase all data</span>
        </div>
      </div>
    </div>

    <div class="section">
        <div class="section-title">Support & Legal</div>
        <a href="terms.html" class="card" style="text-decoration:none;">
            <div class="card-icon" style="background:#f1f5f9; color:var(--muted);">
                <i class="fa-solid fa-file-contract"></i>
            </div>
            <div class="card-content">
                <span class="card-title">Terms of Service</span>
            </div>
        </a>
    </div>

    <nav class="bottom-nav">
      <a href="app.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>HOME</span>
      </a>
      <a href="create-post.html" class="nav-item">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI SEO</span>
      </a>
      <a href="settings.html" class="nav-item active">
        <i class="fa-solid fa-user"></i>
        <span>PROFILE</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      document.getElementById("userName").innerText = user.displayName || "Multipost User";
      document.getElementById("userEmail").innerText = user.email;
    });

    window.handleSignOut = async () => {
      if(confirm("Sign out of Multipost?")) {
        await signOut(auth);
        localStorage.clear();
        window.location.href = "signin.html";
      }
    };

    window.deleteAccount = async () => {
      if(confirm("DANGER: This will permanently delete your account and all your data. This cannot be undone. Proceed?")) {
        try {
          const user = auth.currentUser;
          await deleteUser(user);
          localStorage.clear();
          alert("Account deleted.");
          window.location.href = "index.html";
        } catch (e) {
          alert("For security, you must have logged in recently to delete your account. Please sign out and sign back in, then try again.");
        }
      }
    };
  </script>
</body>
</html>
