<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings | Multipost SEO</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family:sans-serif; margin:0; background:#f9f9f9; color:#111; }
        .app-container { padding-bottom: 80px; }
        .header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .header-btn { background:none; border:none; font-size:20px; cursor:pointer; }
        .section { margin:16px; }
        .card { background:#fff; border-radius:12px; padding:16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; box-shadow:0 2px 5px rgba(0,0,0,0.05); cursor:pointer; }
        .card:hover { background:#f1f5f9; }
        .card-content { flex:1; }
        .card-title { font-weight:700; font-size:16px; }
        .btn-primary { background:#10b981; color:#fff; border:none; padding:12px 24px; border-radius:12px; cursor:pointer; font-weight:600; width:100%; }
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; display:flex; justify-content:space-around; padding:8px 0; background:#fff; box-shadow:0 -2px 5px rgba(0,0,0,0.1); }
        .nav-item { text-align:center; color:#555; font-size:12px; text-decoration:none; display:flex; flex-direction:column; align-items:center; }
    </style>
</head>
<body>
<div class="app-container">
    <header class="header">
        <button class="header-btn" onclick="location.href='app.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1>Settings</h1>
        <div style="width:40px;"></div>
    </header>

    <div class="section">
        <div class="section-title" style="font-weight:700; margin-bottom:8px;">User</div>
        <div class="card" id="userCard">
            <div class="card-content" id="userInfo">Loading user...</div>
            <button class="header-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </div>

    <div class="section">
        <div class="section-title" style="font-weight:700; margin-bottom:8px;">Folders</div>
        <div id="folderList">
            <p style="text-align:center; opacity:0.6;">Loading folders...</p>
        </div>
        <button class="btn-primary" onclick="createFolder()" style="margin-top:12px;">+ Create New Folder</button>
    </div>

    <nav class="bottom-nav">
        <a href="app.html" class="nav-item"><i class="fa-solid fa-house"></i><span>HOME</span></a>
        <a href="create-post.html" class="nav-item"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI SEO</span></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-user"></i><span>PROFILE</span></a>
    </nav>
</div>

<script>
    const apiBase = "https://multipost-seo-worker.alexbryant.workers.dev/api";
    let userScope = null;

    const scopedKey = name => `${name}:${userScope}`;

    async function renderFolders() {
      const container = document.getElementById("folderList");
      container.innerHTML = `<p style="text-align:center; opacity:0.6;">Loading folders...</p>`;

      try {
        const res = await fetch(`${apiBase}/get-folders?user_id=${encodeURIComponent(userScope)}`);
        const folders = await res.json();

        if (!folders.length) {
          container.innerHTML = `<p style="text-align:center; opacity:0.6;">No folders created yet.</p>`;
          return;
        }

        container.innerHTML = folders.map(f => `
          <div class="card" onclick="selectFolder(${f.id}, '${f.name}')">
            <div class="card-content">
              <span class="card-title">${f.name}</span>
              <span class="card-sub" style="font-size:12px; color:#555;">ID: ${f.id}</span>
            </div>
          </div>
        `).join("");

      } catch (err) {
        container.innerHTML = `<p style="color:red; text-align:center;">Failed to fetch folders.</p>`;
      }
    }

    function selectFolder(id, name) {
      localStorage.setItem(scopedKey("activeFolderId"), id);
      localStorage.setItem(scopedKey("activeFolderName"), name);
      alert(`Switched to folder: ${name}`);
    }

    async function createFolder() {
      const folderName = prompt("Enter folder name:");
      if (!folderName) return;

      try {
        await fetch(`${apiBase}/create-folder`, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ name: folderName, user_id: userScope })
        });
        renderFolders();
      } catch (err) {
        alert("Failed to create folder.");
      }
    }

    function logout() {
      if (confirm("Logout?")) {
        localStorage.removeItem(scopedKey("activeFolderId"));
        localStorage.removeItem(scopedKey("activeFolderName"));
        window.location.href = "signin.html";
      }
    }

    // Initialize Firebase Auth
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      userScope = user.uid || user.email;
      document.getElementById("userInfo").innerText = user.displayName || user.email || "Anonymous";
      renderFolders();
    });
</script>
</body>
</html>
