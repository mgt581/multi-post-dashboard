<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multipost | Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

    :root {
      --bg: linear-gradient(135deg, #0f172a, #0b2f52 60%, #0ea5e9);
      --card: #0b1829;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
      --error: #f43f5e;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .page { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

    .badge {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      font-weight: 700;
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .profile-hero {
      flex-direction: column;
      text-align: center;
      background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.15), transparent), var(--card);
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      margin-bottom: 12px;
    }

    h1 { margin: 0; font-size: 24px; }
    .email { color: var(--muted); font-size: 14px; margin-top: 4px; }

    .section-title { font-weight: 800; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-left: 4px; }

    .action-card { cursor: pointer; transition: transform 0.1s; }
    .action-card:active { transform: scale(0.98); }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.05);
    }

    .action-info { flex: 1; }
    .action-title { display: block; font-weight: 700; font-size: 16px; }
    .action-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

    .btn-logout { color: var(--error); }
    .btn-logout .icon-box { background: rgba(244, 63, 94, 0.1); color: var(--error); }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 24, 41, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      text-decoration: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-item.active { color: var(--accent-2); }
    .nav-item i { font-size: 20px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="badge">Account Settings</div>
      <div class="badge">Live</div>
    </header>

    <div class="card profile-hero">
      <div class="avatar">
        <i class="fa-solid fa-user"></i>
      </div>
      <h1 id="userName">Loading...</h1>
      <p id="userEmail" class="email">---</p>
    </div>

    <div class="section-title">Security</div>

    <div class="card action-card btn-logout" onclick="handleSignOut()">
      <div class="icon-box"><i class="fa-solid fa-right-from-bracket"></i></div>
      <div class="action-info">
        <span class="action-title">Sign Out</span>
        <span class="action-sub">Securely end your session</span>
      </div>
    </div>

    <div class="card action-card" onclick="deleteAccount()" style="border-color: rgba(244, 63, 94, 0.3);">
      <div class="icon-box" style="color: var(--error);"><i class="fa-solid fa-user-slash"></i></div>
      <div class="action-info">
        <span class="action-title" style="color: var(--error);">Delete Account</span>
        <span class="action-sub">Permanently erase all data</span>
      </div>
    </div>

    <div class="section-title">Legal</div>
    
    <a href="terms.html" class="card action-card" style="text-decoration: none; color: inherit; margin-bottom: 4px;">
      <div class="icon-box"><i class="fa-solid fa-file-contract"></i></div>
      <div class="action-info">
        <span class="action-title">Terms of Service</span>
        <span class="action-sub">Usage agreement and rules</span>
      </div>
    </a>

    <a href="privacy.html" class="card action-card" style="text-decoration: none; color: inherit;">
      <div class="icon-box"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="action-info">
        <span class="action-title">Privacy Policy</span>
        <span class="action-sub">How we protect your data</span>
      </div>
    </a>
  </div>

  <nav class="bottom-nav">
    <a href="app.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>HOME</span>
    </a>
    <a href="create-post.html" class="nav-item">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>AI SEO</span>
    </a>
    <a href="settings.html" class="nav-item active">
      <i class="fa-solid fa-user"></i>
      <span>PROFILE</span>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJBCJrMwyjLiMFG7QhfG09cKZa_2Y4UGM",
      authDomain: "multi-post-daefc.firebaseapp.com",
      projectId: "multi-post-daefc",
      storageBucket: "multi-post-daefc.appspot.com",
      messagingSenderId: "1099160429576",
      appId: "1:1099160429576:web:6c31651e46d6ad1cd35dbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "signin.html";
        return;
      }
      document.getElementById("userName").innerText = user.displayName || "Multipost User";
      document.getElementById("userEmail").innerText = user.email;
    });

    window.handleSignOut = async () => {
      if(confirm("Sign out of Multipost?")) {
        await signOut(auth);
        localStorage.clear();
        window.location.href = "signin.html";
      }
    };

    window.deleteAccount = async () => {
      if(confirm("DANGER: This will permanently delete your account. Proceed?")) {
        try {
          const user = auth.currentUser;
          await deleteUser(user);
          localStorage.clear();
          window.location.href = "index.html";
        } catch (e) {
          alert("Please sign out and back in to delete your account for security.");
        }
      }
    };
  </script>
</body>
</html>
